<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Education AI - Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ── Modern Variables & Resets ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #6C3FD4; --primary-light: #f0ebff; 
  --bg: #f4f4f9; --surface: #ffffff; --border: #e2e8f0; 
  --text: #1e293b; --muted: #64748b; --error: #ef4444;
}
body.theme-groq { --primary: #f55036; --primary-light: #fdeee9; }
body.theme-openrouter { --primary: #2563eb; --primary-light: #eff6ff; }

html, body { height: 100dvh; font-family: 'Outfit', sans-serif; background: #e0d8f5; overflow: hidden; transition: background 0.4s ease; }
::-webkit-scrollbar { width: 4px; } 
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

/* ── App Container ── */
#appScreen { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }

/* ── Header ── */
.app-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 20; }
.hbtn { width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--primary-light); color: var(--primary); transition: 0.3s; }
.header-center { display: flex; flex-direction: column; align-items: center; }
.header-title { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 800; color: var(--primary); transition: 0.3s; }
.timer-display { font-size: 12px; font-weight: 600; color: var(--muted); background: #f1f5f9; padding: 2px 10px; border-radius: 20px; margin-top: 2px; }
.user-av { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

/* ── Sidebar ── */
.sidebar { position: absolute; top: 0; left: -300px; width: 280px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; display: flex; flex-direction: column; box-shadow: 5px 0 20px rgba(0,0,0,0.05); }
.sidebar.open { left: 0; }
.sb-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; display: none; backdrop-filter: blur(2px); }
.sidebar.open ~ .sb-overlay { display: block; }
.sb-head { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.sb-nav { list-style: none; padding: 15px; }
.sb-nav li { padding: 12px 15px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 10px; transition: 0.2s; }
.sb-nav li:hover, .sb-nav li.active { background: var(--primary-light); color: var(--primary); transform: translateX(5px); }
#histList { list-style: none; padding: 0 15px; max-height: 250px; overflow-y: auto; }
#histList li { padding: 10px 15px; border-radius: 10px; font-size: 13px; color: var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 5px; background: #f8fafc; transition: 0.2s; }
#histList li:hover { background: var(--primary-light); color: var(--primary); }

/* ── Chat Area ── */
.chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
.message { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 14.5px; line-height: 1.6; word-wrap: break-word; animation: fadeIn 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.msg-user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-ai { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.ai-badge { font-size: 11px; font-weight: 800; color: var(--primary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; }

/* ── Notebook LM Zone ── */
.notebook-workspace { display: none; flex: 1; padding: 20px; background: var(--surface); flex-direction: column; overflow-y: auto; animation: fadeIn 0.3s; }
.notebook-workspace.active { display: flex; }
.nb-textarea { flex: 1; width: 100%; border: 2px dashed #cbd5e1; border-radius: 20px; padding: 20px; font-family: inherit; font-size: 14px; resize: none; margin-bottom: 15px; outline: none; transition: 0.3s; background: #f8fafc; }
.nb-textarea:focus { border-color: var(--primary); background: #fff; }
.nb-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 15px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(108, 63, 212, 0.3); }

/* ── Bottom Section ── */
.bottom-sec { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 15px 20px; z-index: 10; }
.input-wrap { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border: 1.5px solid transparent; border-radius: 30px; padding: 6px 6px 6px 15px; margin-bottom: 15px; transition: 0.3s; }
.input-wrap:focus-within { border-color: var(--primary); background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.model-selector { border: none; background: transparent; font-size: 13px; font-weight: 800; color: var(--primary); outline: none; cursor: pointer; font-family: inherit; }
.input-wrap input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; font-family: inherit; color: var(--text); }
#sendBtn { width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; border: none; cursor: pointer; font-size: 16px; display: none; align-items: center; justify-content: center; transition: 0.3s; }

.action-toolbar { display: flex; justify-content: space-around; padding: 0 10px; }
.action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.circle-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--muted); margin-bottom: 6px; background: #f1f5f9; transition: 0.3s; }
.circle-icon svg { width: 20px; height: 20px; }
.action-item:hover .circle-icon { background: var(--primary-light); color: var(--primary); transform: translateY(-3px); }
.action-label { font-size: 11px; color: var(--muted); font-weight: 700; }
.hidden-input { display: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="appScreen">

  <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="header-title" style="font-size: 15px;">Education AI</div>
      <button class="hbtn" style="width:30px;height:30px;font-size:14px;" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="sb-nav">
      <li class="active" onclick="switchTab('chat')">💬 &nbsp;Smart Chat</li>
      <li onclick="switchTab('notebook')">📚 &nbsp;Notebook LM</li>
      <li onclick="newChat()">✚ &nbsp;New Session</li>
    </ul>
    <div style="font-size:10px; font-weight:800; color:var(--muted); padding:10px 15px; text-transform:uppercase; letter-spacing:1px;">History</div>
    <ul id="histList"></ul>
  </div>

  <div class="app-header">
    <button class="hbtn" onclick="toggleSidebar()">☰</button>
    <div class="header-center">
      <div class="header-title">Education AI</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
    </div>
    <div class="user-av">ME</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="message msg-ai">
      <span class="ai-badge">✦ AI Assistant</span>
      হ্যালো! আমি সিস্টেম আপডেট নিয়ে রেডি। আজ কী শিখবো? 😊
    </div>
  </div>

  <div class="notebook-workspace" id="notebookArea">
    <div class="ai-badge" style="text-align:center; font-size:14px; margin-bottom:15px;">Deep Study Zone</div>
    <textarea class="nb-textarea" id="notebookText" placeholder="আপনার পড়া বা নোট এখানে পেস্ট করুন, আমি বিস্তারিত বিশ্লেষণ করে দেব..."></textarea>
    <button class="nb-btn" onclick="generateDeepSummary()">Analyze & Summarize</button>
  </div>

  <div class="bottom-sec" id="bottomSection">
    <div class="input-wrap">
      <select id="modelSelect" class="model-selector">
        <option value="Gemini">Gmni</option>
        <option value="Groq">Groq</option>
        <option value="OpenRouter">OpnR</option>
      </select>
      <input type="text" id="chatInput" placeholder="Message here...">
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>

    <input type="file" id="fileUpload" class="hidden-input" accept="*/*">
    <div class="action-toolbar">
        <div class="action-item" onclick="document.getElementById('fileUpload').click()"><div class="circle-icon">📷</div><span class="action-label">Cam</span></div>
        <div class="action-item" onclick="document.getElementById('fileUpload').click()"><div class="circle-icon">📄</div><span class="action-label">Doc</span></div>
        <div class="action-item" onclick="document.getElementById('fileUpload').click()"><div class="circle-icon">🖼️</div><span class="action-label">Pic</span></div>
        <div class="action-item" onclick="document.getElementById('fileUpload').click()"><div class="circle-icon">🎙️</div><span class="action-label">Mic</span></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase Config
const app = initializeApp({
  apiKey: "AIzaSyA8SdjWHiU931k1-4prnj1FxHpktLaenD0",
  authDomain: "education-ai-8b6d5.firebaseapp.com",
  projectId: "education-ai-8b6d5"
});
const db = getFirestore(app);
let history = [];

// ── Private Encoded API Keys ──
 // ── Private Encoded API Keys ──
const encodedKeys = {
  Gemini: "QUl6YVN" + "5QWxVaENl" + "UFhPbFE0TW45OWl" + "3ZTRrbHlHSjZiek1OQVBj",
  Groq: "Z3NrX3c" + "0M0d1bDdk" + "OVcyMVpHNjJUR0p" + "1V0dkeWIzRllDbTlkb1lPUGk3ZHFlY0Z4N3JmMmNmc08=",
  OpenRouter: "c2stb3I" + "tdjEtMDBh" + "NTU4M2VjMTZjNzQ" + "1YzdjNmRlM2ZiNDI2YTc4YWJhNTU3ZjY1MDc2Yzc4YzgyZmRiZWNkNzBmM2NhOTFmMA=="
};

// ── Timer Logic ──
let sec = 0;
setInterval(() => {
    sec++;
    let m = Math.floor(sec / 60); let s = sec % 60;
    document.getElementById('timerDisplay').innerText = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}, 1000);

// ── Initialization ──
window.onload = async function() {
  await loadHistory();
  
  // Theme Switcher
  document.getElementById('modelSelect').addEventListener('change', function(e) {
      const model = e.target.value;
      if(model === 'Groq') document.body.className = 'theme-groq';
      else if(model === 'OpenRouter') document.body.className = 'theme-openrouter';
      else document.body.className = '';
  });
};

// ── Secure API Caller ──
async function callAPI(model, prompt) {
  const activeKey = atob(encodedKeys[model]); // Decoding dynamically

  if (model === 'Gemini') {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [...history, { role: 'user', parts: [{ text: prompt }] }] })
      });
      const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      return d.candidates[0].content.parts[0].text;
  } 
  else if (model === 'Groq') {
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST", headers: { "Authorization": `Bearer ${activeKey}`, "Content-Type": "application/json" },
          body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "user", content: prompt }] })
      });
      const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      return d.choices[0].message.content;
  }
  else if (model === 'OpenRouter') {
      const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST", headers: { "Authorization": `Bearer ${activeKey}`, "Content-Type": "application/json" },
          body: JSON.stringify({ model: "google/gemma-7b-it:free", messages: [{ role: "user", content: prompt }] })
      });
      const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      return d.choices[0].message.content;
  }
}

// ── Send Message ──
window.sendMsg = async function() {
  const inp = document.getElementById('chatInput');
  const txt = inp.value.trim(); if (!txt) return;
  const model = document.getElementById('modelSelect').value;
  
  inp.value = ''; document.getElementById('sendBtn').style.display = 'none';
  addMsg('msg-user', '', txt);
  history.push({ role: 'user', parts: [{ text: txt }] });
  
  const el = addMsg('msg-ai', `✦ ${model}`, '<div class="loading"></div>');
  
  try {
    const rep = await callAPI(model, txt);
    el.innerHTML = `<span class="ai-badge">✦ ${model}</span>${rep.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}`;
    history.push({ role: 'model', parts: [{ text: rep }] });
    try { await addDoc(collection(db, 'my_chats'), { q: txt, a: rep, ts: serverTimestamp() }); await loadHistory(); } catch(e){}
  } catch(e) {
    el.innerHTML = `<span class="ai-badge" style="color:red">Error</span>${e.message}`;
  }
};

// ── Notebook Logic ──
window.generateDeepSummary = async function() {
  const text = document.getElementById('notebookText').value.trim();
  if(!text) return;
  switchTab('chat');
  addMsg('msg-user', '', 'Analyzing Notes...');
  const el = addMsg('msg-ai', '✦ Notebook LM', '<div class="loading"></div>');
  
  try {
      const prompt = `Act as an expert teacher. Analyze this deeply and explain in easy Bengali point by point: ${text}`;
      const rep = await callAPI('Gemini', prompt);
      el.innerHTML = `<span class="ai-badge">✦ Notebook LM Result</span>${rep.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}`;
  } catch(e) {
      el.innerHTML = `<span class="ai-badge" style="color:red">Error</span>Failed to analyze.`;
  }
};

// ── UI Controls ──
window.switchTab = function(tab) {
    toggleSidebar();
    const isNb = (tab === 'notebook');
    document.getElementById('chatArea').style.display = isNb ? 'none' : 'flex';
    document.getElementById('bottomSection').style.display = isNb ? 'none' : 'block';
    document.getElementById('notebookArea').classList.toggle('active', isNb);
    document.querySelectorAll('.sb-nav li').forEach(li => li.classList.remove('active'));
    event.currentTarget.classList.add('active');
};

window.toggleSidebar = function() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
  document.getElementById('sbOverlay').style.display = sb.classList.contains('open') ? 'block' : 'none';
};

window.newChat = function() { history=[]; document.getElementById('chatArea').innerHTML=`<div class="message msg-ai"><span class="ai-badge">✦ AI</span>নতুন সেশন শুরু হলো!</div>`; toggleSidebar(); };

function addMsg(cls, badge, html) {
  const a = document.getElementById('chatArea');
  const d = document.createElement('div'); d.className = 'message ' + cls;
  d.innerHTML = badge ? `<span class="ai-badge">${badge}</span>${html}` : html;
  a.appendChild(d); a.scrollTop = a.scrollHeight; return d;
}

async function loadHistory() {
  try {
    const q = query(collection(db, 'my_chats'), orderBy('ts','desc'));
    const s = await getDocs(q);
    const ul = document.getElementById('histList'); ul.innerHTML='';
    s.forEach(d => {
      const li = document.createElement('li'); li.textContent = (d.data().q||'').slice(0,30)+'…';
      li.onclick = () => { 
        switchTab('chat'); document.getElementById('chatArea').innerHTML = '';
        addMsg('msg-user','',d.data().q); addMsg('msg-ai','✦ AI', (d.data().a||'').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g,'<br>')); 
        history = []; toggleSidebar(); 
      };
      ul.appendChild(li);
    });
  } catch(e) {}
}

const inp = document.getElementById('chatInput');
inp.oninput = () => document.getElementById('sendBtn').style.display = inp.value.trim() ? 'flex' : 'none';
inp.onkeydown = e => { if(e.key === 'Enter') sendMsg(); };
</script>
</body>
          </html>
